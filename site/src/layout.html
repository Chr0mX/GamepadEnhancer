<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}}</title>
  <meta name="description" content="{{description}}">
  <meta property="og:title" content="{{title}}">
  <meta property="og:description" content="{{description}}">
  <meta property="og:type" content="website">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <script>
    /* apply the saved theme before first paint (no flash); falls back to the OS setting via CSS */
    try { var t = localStorage.getItem('vigem-theme'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) {}
  </script>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-nav">
    <div class="container">
      <a class="brand" href="index.html" aria-label="GamepadEnhancer - home">
        <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="11" fill="none" style="stroke:var(--color-border-strong)" stroke-width="2"/><path d="M16 5v22M5 16h22" style="stroke:var(--color-border)" stroke-width="1.2"/><circle cx="21" cy="20" r="4.2" style="fill:var(--color-accent)"/></svg>
        <span>GamepadEnhancer</span>
      </a>
      <button class="icon-button nav-toggle" id="nav-toggle" type="button" aria-expanded="false" aria-controls="nav-links" aria-label="Toggle menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <ul class="nav-links" id="nav-links">
{{nav}}
      </ul>
      <button class="icon-button theme-slot" id="theme-toggle" type="button" aria-label="Switch between light and dark theme">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </header>

  <main id="main">
{{content}}
  </main>

  <footer class="site-footer">
    <div class="container">
      <div>
        <strong>GamepadEnhancer</strong><br>
        <span>A hobby project. Not affiliated with Microsoft, Sony or Nefarius. Virtual controllers by the <a href="https://github.com/nefarius/ViGEmBus">ViGEmBus</a> driver.</span>
      </div>
      <ul>
        <li><a href="https://github.com/Chr0mX/GamepadEnhancer">Source</a></li>
        <li><a href="https://github.com/Chr0mX/GamepadEnhancer/releases">Releases</a></li>
        <li><a href="https://github.com/Chr0mX/GamepadEnhancer/tree/main/docs">Docs</a></li>
        <li><a href="reference.html#faq">Troubleshooting</a></li>
      </ul>
    </div>
  </footer>
  <script src="js/app.js" defer></script>
</body>
</html>
